[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caspoc"
version = "0.1.1"
description = "Python implementation of CASPOC-style double-split CV with approximate sparse PLS."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "CASPOC Python contributors" }
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]

[tool.hatch.build.targets.wheel]
packages = ["src/caspoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"
